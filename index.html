<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA REMINI ✨ AI Photo Enhancer</title>
  <style>
    /* ==========================================================================
       1. GLOBAL & THEME STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0A0A0A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Gold Gradient Header */
    header {
      text-align: center;
      padding: 10px 0;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFF 0%, #FFD700 50%, #FF8C00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    header p {
      color: #888;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* ==========================================================================
       2. UPLOAD ZONE
       ========================================================================== */
    .upload-box {
      border: 2px dashed #FFD700;
      border-radius: 16px;
      background: rgba(255, 215, 0, 0.03);
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .upload-box:hover {
      background: rgba(255, 215, 0, 0.08);
      border-color: #FFA500;
      transform: translateY(-2px);
    }

    .upload-icon {
      font-size: 2.8rem;
      margin-bottom: 10px;
      display: block;
    }

    .upload-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #FFD700;
      margin-bottom: 4px;
    }

    .upload-sub {
      font-size: 0.8rem;
      color: #888;
    }

    #fileInput {
      display: none;
    }

    /* ==========================================================================
       3. AI TOOLS GRID
       ========================================================================== */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .tool-btn {
      background: #141414;
      border: 1px solid #2A2A2A;
      border-radius: 12px;
      padding: 14px 10px;
      color: #FFF;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .tool-btn:hover:not(:disabled) {
      border-color: #FFD700;
      background: #1E1E1E;
      color: #FFD700;
      transform: translateY(-2px);
    }

    .tool-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ==========================================================================
       4. BEFORE / AFTER COMPARISON SLIDER
       ========================================================================== */
    .comparison-container {
      display: none;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    .comparison-slider {
      position: relative;
      width: 100%;
      height: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #333;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .slider-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050505;
    }

    .img-before-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
      z-index: 2;
      border-right: 2px solid #FFD700;
    }

    .img-before-wrapper .slider-img {
      width: 100%;
      max-width: none;
    }

    /* Labels */
    .label {
      position: absolute;
      top: 12px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
      z-index: 4;
      text-transform: uppercase;
    }

    .label-before {
      left: 12px;
      color: #AAA;
    }

    .label-after {
      right: 12px;
      color: #FFD700;
      border-color: rgba(255, 215, 0, 0.4);
    }

    /* Range Input Slider Control */
    .slider-control {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 5;
      cursor: ew-resize;
    }

    /* Slider Split Handle Line & Circle */
    .slider-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 2px;
      background: #FFD700;
      z-index: 3;
      transform: translateX(-50%);
      pointer-events: none;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    .slider-handle-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      background: #FFD700;
      border-radius: 50%;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    /* ==========================================================================
       5. ACTION BUTTONS & LOADING OVERLAY
       ========================================================================== */
    .download-btn {
      width: 100%;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      color: #000;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 16px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
      transition: all 0.2s ease;
    }

    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 215, 0, 0.4);
    }

    /* Loader Modal */
    .loader-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 10, 0.9);
      z-index: 99;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 215, 0, 0.1);
      border-top-color: #FFD700;
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #FFD700;
      text-align: center;
    }

    @media (max-width: 480px) {
      .tools-grid {
        grid-template-columns: 1fr 1fr;
      }
      .comparison-slider {
        height: 320px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <h1>NOVA REMINI ✨</h1>
      <p>AI Photo Enhancer & Quality Restorer</p>
    </header>

    <!-- Upload Box -->
    <div class="upload-box" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <span class="upload-icon">📸</span>
      <div class="upload-title" id="uploadTitle">Select Photo</div>
      <div class="upload-sub">Click or drag & drop image here (JPG, PNG)</div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <!-- AI Tools Grid -->
    <div class="tools-grid">
      <button class="tool-btn" id="btn4k" disabled onclick="processImage('4k')">🚀 Enhance 4K</button>
      <button class="tool-btn" id="btnSmooth" disabled onclick="processImage('smooth')">🧑 Face Smooth</button>
      <button class="tool-btn" id="btnBg" disabled onclick="processImage('bg')">🟢 BG Remove</button>
      <button class="tool-btn" id="btnCartoon" disabled onclick="processImage('cartoon')">🎨 AI Cartoon</button>
    </div>

    <!-- Before/After Comparison Container -->
    <div class="comparison-container" id="comparisonContainer">
      <div class="comparison-slider" id="sliderContainer">
        <!-- Labels -->
        <span class="label label-before">Original</span>
        <span class="label label-after">Enhanced</span>

        <!-- After Image -->
        <img id="imgAfter" class="slider-img" alt="Enhanced Photo" crossorigin="anonymous">

        <!-- Before Image -->
        <div class="img-before-wrapper" id="beforeWrapper">
          <img id="imgBefore" class="slider-img" alt="Original Photo">
        </div>

        <!-- Slider Line & Handle -->
        <div class="slider-handle" id="sliderHandle">
          <div class="slider-handle-button">↔</div>
        </div>

        <!-- Interactive Range Input -->
        <input type="range" min="0" max="100" value="50" class="slider-control" id="sliderRange">
      </div>

      <!-- Download Button -->
      <button class="download-btn" onclick="downloadImage()">
        ⬇️ Download HD
      </button>
    </div>
  </div>

  <!-- Processing Modal Loader -->
  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <div class="loader-text" id="loaderText">AI Enhancing... Please wait</div>
  </div>

  <script>
    /* ==========================================================================
       REPLICATE API INTEGRATION
       ========================================================================== */
    const REPLICATE_API_KEY = "r8_E3SK7B1yD6a8dE3s5g17SkoDHzQxkhL0VYmr4";
    const CORS_PROXY = "https://corsproxy.io/?";

    // Model Specs on Replicate
    const REPLICATE_MODELS = {
      '4k': {
        version: "f121d640db2896da3f610e3928ea001509c04118d5e0630935f19017327f583a", // Real-ESRGAN
        getInput: (dataUrl) => ({ image: dataUrl, scale: 4, face_enhance: true })
      },
      'smooth': {
        version: "7de2ea26c616d5bf2245ad0d5e24f0ff9a6204578a5c876db73146e07573b6f1", // CodeFormer
        getInput: (dataUrl) => ({ image: dataUrl, codeformer_fidelity: 0.7, background_enhance: true, face_upscale: true })
      },
      'bg': {
        version: "fb84d6ee38d084ee20216b2553b6f2414704f057e62a4ebf07d2f9b89793132e", // Rembg
        getInput: (dataUrl) => ({ image: dataUrl })
      },
      'cartoon': {
        version: "f121d640db2896da3f610e3928ea001509c04118d5e0630935f19017327f583a", // Anime / Enhanced stylizer
        getInput: (dataUrl) => ({ image: dataUrl, scale: 2, face_enhance: true })
      }
    };

    // Global variables
    let rawImageDataUrl = null;

    const fileInput = document.getElementById('fileInput');
    const uploadTitle = document.getElementById('uploadTitle');
    const imgBefore = document.getElementById('imgBefore');
    const imgAfter = document.getElementById('imgAfter');
    const beforeWrapper = document.getElementById('beforeWrapper');
    const sliderHandle = document.getElementById('sliderHandle');
    const sliderRange = document.getElementById('sliderRange');
    const comparisonContainer = document.getElementById('comparisonContainer');
    const loader = document.getElementById('loader');
    const toolBtns = document.querySelectorAll('.tool-btn');

    /* ==========================================================================
       FILE LOADING & HANDLING
       ========================================================================== */
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        loadImage(file);
      }
    });

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        rawImageDataUrl = event.target.result;
        
        imgBefore.src = rawImageDataUrl;
        imgAfter.src = rawImageDataUrl;

        toolBtns.forEach(btn => btn.disabled = false);
        uploadTitle.innerText = "Photo Loaded: " + file.name;
        
        // Auto run 4K enhance on upload
        processImage('4k');
      };
      reader.readAsDataURL(file);
    }

    /* ==========================================================================
       BEFORE / AFTER SLIDER LOGIC
       ========================================================================== */
    sliderRange.addEventListener('input', function(e) {
      const val = e.target.value;
      beforeWrapper.style.width = val + '%';
      sliderHandle.style.left = val + '%';
    });

    function syncImageDimensions() {
      const containerWidth = document.getElementById('sliderContainer').offsetWidth;
      imgBefore.style.width = containerWidth + 'px';
    }
    window.addEventListener('resize', syncImageDimensions);

    /* ==========================================================================
       REPLICATE API CALL & POLLING LOGIC
       ========================================================================== */
    async function processImage(type) {
      if (!rawImageDataUrl) return;

      const modelConfig = REPLICATE_MODELS[type];
      if (!modelConfig) return;

      showLoader(`AI Processing (${type.toUpperCase()})... Please wait`);

      try {
        // Step 1: Create prediction on Replicate
        const targetUrl = "https://api.replicate.com/v1/predictions";
        const response = await fetch(CORS_PROXY + encodeURIComponent(targetUrl), {
          method: "POST",
          headers: {
            "Authorization": `Token ${REPLICATE_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            version: modelConfig.version,
            input: modelConfig.getInput(rawImageDataUrl)
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.detail || "Failed to start AI prediction");
        }

        const prediction = await response.json();
        const getUrl = prediction.urls.get;

        // Step 2: Poll status until complete
        const finalOutputUrl = await pollPredictionStatus(getUrl);

        // Step 3: Render enhanced image
        imgAfter.src = finalOutputUrl;
        comparisonContainer.style.display = 'flex';
        syncImageDimensions();

      } catch (err) {
        alert("AI Processing Error: " + err.message);
        console.error(err);
      } finally {
        hideLoader();
      }
    }

    async function pollPredictionStatus(pollUrl) {
      const maxAttempts = 30;
      let attempts = 0;

      while (attempts < maxAttempts) {
        attempts++;
        showLoader(`AI Processing... (${attempts * 2}s)`);

        await new Promise(resolve => setTimeout(resolve, 2000));

        const res = await fetch(CORS_PROXY + encodeURIComponent(pollUrl), {
          headers: {
            "Authorization": `Token ${REPLICATE_API_KEY}`
          }
        });

        if (!res.ok) continue;

        const data = await res.json();

        if (data.status === "succeeded") {
          return Array.isArray(data.output) ? data.output[0] : data.output;
        } else if (data.status === "failed" || data.status === "canceled") {
          throw new Error(data.error || "AI processing failed.");
        }
      }

      throw new Error("Request timed out.");
    }

    /* ==========================================================================
       DOWNLOAD & UTILITY FUNCTIONS
       ========================================================================== */
    async function downloadImage() {
      const imageUrl = imgAfter.src;
      if (!imageUrl) return;

      try {
        showLoader("Preparing HD Download...");
        const response = await fetch(imageUrl);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.download = 'nova-remini-enhanced.jpg';
        link.href = blobUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (e) {
        window.open(imageUrl, '_blank');
      } finally {
        hideLoader();
      }
    }

    function showLoader(text) {
      document.getElementById('loaderText').innerText = text;
      loader.style.display = 'flex';
    }

    function hideLoader() {
      loader.style.display = 'none';
    }

    // Drag and drop listeners
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#FFA500';
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#FFD700';
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files && files[0]) {
        loadImage(files[0]);
      }
    });
  </script>
</body>
</html>
